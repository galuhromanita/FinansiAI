<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FinansiAI - Loading</title>

    <!-- Auto Redirect -->
    <script>
      setTimeout(() => (window.location.href = "/process"), 1500);
    </script>

    <!-- Tailwind (built CSS) -->
    <link rel="stylesheet" href="{{ url_for('static', path='css/tw.css') }}" />

    <!-- Fonts -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Custom CSS (overrides) -->
    <link
      rel="stylesheet"
      href="{{ url_for('static', path='css/style.css') }}"
    />
  </head>

  <body class="bg-white h-screen overflow-hidden font-[Inter]">
    <!-- NAVBAR -->
    <nav class="navbar-main">
      <div class="navbar-left">
        <img
          src="{{ url_for('static', path='img/logo.png') }}"
          alt="FinansiAI Logo"
          class="h-16 w-16"
        />
        <span class="navbar-title">
          Finansi<span class="text-[#D6CC99]">AI</span>
        </span>
      </div>

      <div class="navbar-links">
        <a href="/" class="navbar-link">Home</a>
      </div>
    </nav>

    <!-- BACKGROUND -->
    <div aria-hidden="true" class="bg-shape-loading"></div>

    <!-- LOADING SECTION -->
    <main class="loading-wrapper">
      <div class="loading-spinner"></div>

      <h2 class="loading-title">Memproses Data...</h2>

      <p class="loading-subtitle">
        Mohon tunggu sebentar.<br />
        <span class="text-[#445D48] font-semibold">FinansiAI</span>
        sedang menyusun laporan Anda.
      </p>
    </main>

    <!-- Icons -->
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
    <script>
      if (window.lucide && typeof lucide.createIcons === "function") {
        lucide.createIcons();
      }
    </script>
  </body>
</html>
